    <title>Concept A - Sidebar a workspace</title>
    <!--
			Scelta: C (Strip) al giro 2, con le righe globali Needs you, Snoozed e Settled. Aperti: drag
			(riordino gruppi, tab fra workspace), mobile, sync dei gruppi nel codice vero.

			Concept A: con la sidebar a workspace (progetti) e i thread come tab sopra la chat, dove
			vivono gli stati di oggi (pinned, working, snoozed, settled).
			Tasti: x a b c per la variante, t tema, p nasconde la barra (con i controlli dev), s cicla lo stato
			della tab aperta. Click destro su una tab (o su una riga thread in X) apre il menu vero;
			click destro su una riga workspace apre il menu del progetto. Solo desktop (min 1200px).

			Il problema: la sidebar di T3 è centrata sui thread. Con tanti progetti aperti diventa una
			lista lunga di card da 78px dove il progetto è una riga di metadati; per sapere "cosa c'è
			aperto su relay" serve il filtro per progetto o la boring sidebar (beta). Simone vuole il
			modello di Relay: la sidebar elenca i progetti, i thread di un progetto sono tab.

			Requisiti fissi (uguali in A, B, C):
			- Sidebar = workspace (progetti). Thread = tab in una strip in cima al contenuto.
			- Ogni tab ha il suo indicatore di stato e le azioni per-thread di oggi (menu completo,
			  hover Snooze e Settle). Le tab pinnate stanno a sinistra della strip.
			- La riga del workspace mostra lo stato più urgente fra le sue tab vive:
			  needs you (Approval, Input) > Failed > Working > Done (finito non letto) > idle.
			- Gruppi di workspace come Relay: card collassabili con conteggio, sincronizzate.
			  Workspace pinnati in cima.
			- Gli stati di oggi esistono tutti: Pinned, Working, Snoozed, Settled.

			X  oggi: replica della sidebar di T3 (card thread a tre righe, pinned in cima senza
			   etichetta, shelf Working (beta), Snoozed e Settled collassati in fondo), contenuto
			   senza strip. Termine di paragone.
			A  Inbox: in cima alla sidebar uno shelf trasversale di TAB (Needs you, poi Working), sotto
			   pinned, gruppi e workspace; Snoozed e Settled sono shelf di tab collassati in fondo alla
			   sidebar, come oggi. La strip mostra solo le tab vive.
			B  Sections: niente shelf di tab. I workspace sono ordinati in sezioni (Pinned, Needs you,
			   Working, Idle) secondo la tab più urgente, i gruppi dentro le sezioni. Le tab snoozed e
			   settled si ripiegano nel "+N" in fondo alla strip, come in C (B decide solo la sidebar).
			C  Strip: sidebar solo pinned, gruppi e workspace con badge (Relay puro). Pinned a sinistra
			   della strip, snoozed e settled nel "+N" in fondo alla strip.
			Quindi: A contro C confronta "stati delle tab in sidebar" contro "stati delle tab nella
			strip"; B contro C confronta "sezioni per stato" contro "ordine stabile".

			Ispirazione: Relay (docs/features/sidebar.md, attention.md, images/hero.png e home.png,
			concepts/concept-a-navigazione.html).
			Preso: workspace = progetto e tab = sessione; card di gruppo (collasso, conteggio, chiusa
			mostra lo stato del membro più urgente come la cartella della boring sidebar); pinned in
			cima con l'icona pin al posto della cartella; riga a due linee (nome, poi la tab che conta);
			il campo "Go to project…" in testa; il "Needs you / Working" della Home di Relay, che in A
			diventa lo shelf.
			Non preso: i colori dei gruppi (T3 è monocromo e il colore in sidebar significa stato);
			Home e Projects come pagine (decisione a parte, e in A si sovrapporrebbe all'inbox);
			l'anello di attenzione attorno al contenuto; il bump della riga in cima a ogni attività
			non vista; ⌘P, perché in T3 la palette è già ⌘K.

			Mappatura sul codice di oggi (fattibilità, non piano):
			- Stato per tab: `resolveSidebarThreadStatus` in apps/web/src/components/Sidebar.logic.ts,
			  con le etichette e le icone di `topStatus` in sidebar/SidebarThreadRow.tsx (Approval,
			  Input, Request, Limited, Failed, Woke, Done, Working, Waiting). Già per thread.
			- Stato del workspace: esiste già `resolveProjectStatusIndicator` (Sidebar.logic.ts), con
			  la priorità Pending Approval > Awaiting Input > Guest Request > Failed > Working >
			  Waiting > Plan Ready > Completed: coincide con l'ordine chiesto. Attenzione: il pallino
			  delle cartelle della boring sidebar (`resolveSidebarFolderDot`) mette unread SOPRA
			  working. Oggi convivono due regole; la riga workspace ne deve scegliere una.
			- Azioni della tab: `buildThreadActionMenuItems` (threadActionMenu.logic.ts), la stessa
			  lista del mock. "Filter by <project>" perde senso (il workspace è già il filtro), quindi
			  nel mock c'è solo in X. "Turn into project" resta per le tab di No project.
			  Hover: Snooze (`SnoozeMenuButton`, preset da DEFAULT_SNOOZE_PRESETS) e Settle.
			- Progetti e thread sono già stato server sincronizzato (proiezioni dell'orchestrazione).
			  Il pin di progetto esiste già (`pinnedAt` in contracts/orchestrationProject.ts, usato
			  dalla boring sidebar); i thread hanno già pin, ordine server, snooze e settle.
			- Gruppi: campo nuovo in `ServerSettings` (packages/contracts/src/settings.ts, persistito
			  nel settings.json dell'environment), per esempio `projectGroups: [{ id, name,
			  projectKeys }]`, non nel database. Si vede da tutti i client dello stesso environment;
			  con più environment ogni environment ha i suoi gruppi, salvo un salvataggio su "All
			  environments" come le snooze options. Lo stato aperto/chiuso della card resta per
			  device, come le cartelle di oggi.
			- Nuovo: la strip di tab sopra ChatHeader, la riga workspace con lo stato aggregato, la
			  card di gruppo e il suo drag, l'overflow "+N" (B, C) o gli shelf di tab (A).
			- Desktop avvolge il web, quindi la stessa modifica vale per web e desktop. Mobile resta
			  thread-centrico: il modello a workspace andrebbe deciso anche lì, fuori da questo mock.

			Dati: inventati e plausibili. Progetti personali di Simone (t3code, relay, claude-setup,
			nexus, floppy, esse.dev, portsage, un nome lungo per il troncamento, No project per i
			thread senza progetto), gruppi "Personal tools" e "Sites", t3code con 9 tab (7 vive) per
			stressare la strip. Titoli, branch e messaggi inventati; modelli presi dai default del
			repo (Opus 5.5, Sonnet 5, GPT-6 Astra, GPT-5.6 Sol). Ora finta: lunedì 2 nov, 4:20 PM.
			Token: valori copiati da apps/web/src/index.css (tema scuro e chiaro, blocco
			[data-app-sidebar]) e dalla palette Tailwind 4.3.3; icone di stato lucide come in T3.

			Giro 2: Simone sceglie C. Il feedback tocca solo C; X, A e B restano nel file come erano.
			- Priorità del badge invariata (confermata da Simone): needs you (Approval, Input) >
			  Failed > Working > Done (finito non letto) > idle. Coincide con
			  `resolveProjectStatusIndicator`, non col pallino delle cartelle
			  (`resolveSidebarFolderDot`, che mette unread sopra working).
			- In fondo alla sidebar, fuori dallo scroll, tre righe globali compatte: Needs you,
			  Snoozed, Settled, ognuna col conteggio. Ognuna apre un popover cross-workspace accanto
			  alla sidebar: Needs you raggruppa Waiting for you (Approve e Decline sul posto per le
			  approvazioni, Answer per le domande), Failed e Finished, not read; Snoozed mostra l'ora
			  di risveglio e Wake; Settled le 10 più recenti con Un-settle e "Show all settled". Una
			  voce apre il suo workspace e la sua tab. I conteggi seguono il controllo dev e le
			  azioni del menu (snooze, settle, wake, archive).
			- Il "+N" della strip apre lo stesso popover limitato al workspace: Snoozed in cima con
			  ora e Wake, poi Settled (ultime 10) con "Show all settled".
			- Icone dei workspace come T3 (`ProjectFavicon`, apps/web/src/components/ProjectFavicon.tsx):
			  1. override dell'utente da Project settings (`projectIcon`: monogram, emoji o icona
			     lucide con colore);
			  2. altrimenti la favicon del repo, che il server cerca (apps/server/src/project/
			     ProjectFaviconResolver.ts) fra `faviconPath` di t3.json, una lista fissa di file
			     (favicon.svg/.ico/.png in radice, public/, app/, src/, assets/icon e logo,
			     AppIcon.icns) e il <link rel="icon"> di index.html o della root route;
			  3. senza favicon, il monogramma di `deriveProjectIdentity` (apps/web/src/
			     projectIdentity.ts): due glifi dal nome (prima lettera più la prima cifra, o
			     l'iniziale dell'ultima parola, o l'ultima lettera) e uno dei 18 colori di
			     PROJECT_ICON_COLORS scelto da un hash del nome, tinta 600 in chiaro e 400 in scuro
			     su un fondo al 14% (`ProjectMonogram`). FolderCodeIcon resta solo per un nome vuoto.
			  Nel mock la stessa logica in JS. Ho guardato i repo veri: solo esse.dev ha una favicon
			  fra i candidati (public/favicon.svg, copiata inline); portsage punta a /vite.svg che
			  non esiste, quindi monogramma come gli altri. No project non ha un progetto e T3 non gli
			  dà icona: tengo l'icona chat neutra. In C il pin del workspace diventa un pin piccolo
			  dopo il nome, perché sostituire l'icona farebbe perdere l'identità del progetto.
			- Dati: più tab settled (19 in tutto, 13 su t3code) per mettere alla prova il limite di
			  10, e una snoozed in più su relay. Le tab vive restano quelle del primo giro.
		-->

      };
      const wsOf = (id) => WS.find((w) => w.id === id);
      const tabOf = (id) => TABS.find((t) => t.id === id);
      const isLive = (t) => !t.snoozed && !t.settled;
      const isNeeds = (s) => s === "approval" || s === "input";
      const tabsOf = (ws) => TABS.filter((t) => t.ws === ws);
      const liveOf = (ws) => tabsOf(ws).filter(isLive);
      const ordered = (list) => [...list.filter((t) => t.pinned), ...list.filter((t) => !t.pinned)];
      const topTab = (list) =>
        list.reduce(
          (best, t) => (STATUS[t.status].rank > (best ? STATUS[best.status].rank : 0) ? t : best),
          null,
        );
      const activeTab = () => {
        const t = tabOf(S.tab[S.ws]);
        if (t && t.ws === S.ws) return t;
        const first = ordered(liveOf(S.ws))[0] || tabsOf(S.ws)[0] || null;
        if (first) S.tab[S.ws] = first.id;
        return first;
      };
      const isOpen = (key, dflt = true) => (key in S.open ? S.open[key] : dflt);
      const statusIcon = (t, cls = "") => {
        const m = STATUS[t.status];
        if (t.woke && !m.icon) return svg("woke", `s-woke ${cls}`);
        return m.icon
          ? svg(m.icon, `s-${t.status} ${t.status === "working" ? "pulse" : ""} ${cls}`)
          : "";
      };
      const prov = (t) => svg(t.provider, `prov ${t.provider}`);

      /* X: today's sidebar. */
      function xRow(t) {
        const w = wsOf(t.ws);
        const m = STATUS[t.status];
        const parked = !isLive(t);
        const recede =
          !parked && t.status === "working" && t.id !== activeTab()?.id && t.ws !== S.ws;
        let right;
        if (t.snoozed) right = `<span class="st s-working">${svg("woke")}${esc(t.snoozed)}</span>`;
        else if (t.woke && !m.icon) right = `<span class="st s-woke">${svg("woke")}Woke</span>`;
        else if (m.icon)
          right = `<span class="st s-${t.status}">${statusIcon(t)}${m.label}${t.status === "working" ? " " + t.age : ""}</span>`;
        else right = `<span class="age">${t.age}</span>`;
        const hov = t.snoozed
          ? `<button data-act="wake" data-id="${t.id}" aria-label="Wake thread now">${svg("clock")}</button>`
          : t.settled
            ? `<button data-act="unsettle" data-id="${t.id}" aria-label="Un-settle thread">${svg("undo")}</button>`
            : `<button data-act="snoozemenu" data-id="${t.id}" aria-label="Snooze thread">${svg("clock")}</button><button data-act="settle" data-id="${t.id}">${svg("check")}Settle</button>`;
        const on = S.ws === t.ws && activeTab()?.id === t.id;
        return `<div class="trow ${on ? "on" : ""} ${recede ? "recede" : ""} ${parked ? "parked" : ""}" data-tab="${t.id}">
					<div class="l1">${svg(w.scratch ? "scratch" : "folder", "fav")}${t.pinned ? svg("pin", "pinmark") : ""}<span class="pn">${esc(w.name)}</span>${right}<span class="hov">${hov}</span></div>
					<div class="l2">${esc(t.title)}</div>
					<div class="l3">${t.branch ? svg("branch") + `<span>${esc(t.branch)}</span>` : `<span>MacBook Pro</span>`}${prov(t)}</div>
				</div>`;
      }
      function secHead(key, label, count, dflt = true) {
        const open = isOpen(key, dflt);
        return `<div class="sec ${open ? "" : "shut"}" data-toggle="${key}"><span>${label}</span><span class="n">${count}</span>${svg("down")}</div>`;
      }
      function sideX() {
        const live = TABS.filter(isLive);
        const pinned = live.filter((t) => t.pinned);
        const working = live.filter((t) => !t.pinned && t.status === "working");
        const active = live.filter((t) => !t.pinned && t.status !== "working");
        const snoozed = TABS.filter((t) => t.snoozed);
        const settled = TABS.filter((t) => t.settled);
        let h = pinned.map(xRow).join("") + active.map(xRow).join("") + '<div class="grow"></div>';
        h +=
          secHead("xWorking", "Working", working.length, false) +
          (isOpen("xWorking", false) ? working.map(xRow).join("") : "");
        h +=
          secHead("xSnoozed", "Snoozed", snoozed.length, false) +
          (isOpen("xSnoozed", false) ? snoozed.map(xRow).join("") : "");
        h +=
          secHead("xSettled", "Settled", settled.length, false) +
          (isOpen("xSettled", false) ? settled.map(xRow).join("") : "");
        return h;
      }

      /* A, B, C: workspace rows and group cards. */
      function wsRow(w) {
        const live = liveOf(w.id);
        const tp = topTab(live);
        const shown = tp || (S.ws === w.id ? activeTab() : ordered(live)[0]);
        const sub = tp
          ? `<span class="lbl s-${tp.status}">${STATUS[tp.status].label}</span> · ${esc(tp.title)}`
          : shown
            ? esc(shown.title)
            : "No open threads";
        const isC = body.dataset.base === "c";
        const lead = isC
          ? projIcon(w)
          : w.pinned
            ? svg("pin", "lead")
            : svg(w.scratch ? "scratch" : "folder", "lead");
        const nameHtml = isC
          ? `<span class="namerow"><b>${esc(w.name)}</b>${w.pinned ? svg("pin", "pinmark") : ""}</span>`
          : `<b>${esc(w.name)}</b>`;
        return `<div class="ws ${S.ws === w.id ? "on" : ""} ${w.pinned && !isC ? "pinned" : ""} ${tp ? "" : "quiet"}" data-ws="${w.id}">
					${lead}<span class="txt">${nameHtml}<small>${sub}</small></span>
					<span class="end">${live.length}${tp ? statusIcon(tp) : ""}</span></div>`;
      }
      function groupCard(g, members, keySuffix = "") {
        const key = `g:${g.id}`;
        const open = isOpen(key);
        const tp = topTab(members.flatMap((w) => liveOf(w.id)));
        return `<div class="gcard ${open ? "" : "shut"}">
					<div class="ghd" data-toggle="${key}" data-group="${g.id}">${svg("down")}<span>${esc(g.name)}</span><span class="n">${members.length}</span>${!open && tp ? statusIcon(tp) : ""}</div>
					${open ? members.map(wsRow).join("") : ""}</div>`;
      }
      function wsBlock(list) {
        let h = "";
        for (const g of GROUPS) {
          const members = list.filter((w) => w.group === g.id);
          if (members.length) h += groupCard(g, members);
        }
        return (
          h +
          list
            .filter((w) => !w.group)
            .map(wsRow)
            .join("")
        );
      }
      function irow(t, kind) {
        const w = wsOf(t.ws);
        const on = S.ws === t.ws && activeTab()?.id === t.id;
        let icon,
          lbl,
          hov = "";
        if (kind === "snoozed") {
          icon = svg("woke", "s-working");
          lbl = `<span class="lbl s-working">${esc(t.snoozed)}</span>`;
          hov = `<button class="ibtn" data-act="wake" data-id="${t.id}" aria-label="Wake thread">${svg("clock")}</button>`;
        } else if (kind === "settled") {
          icon = svg("check", "s-idle");
          lbl = `<span class="lbl s-idle">${t.age}</span>`;
          hov = `<button class="ibtn" data-act="unsettle" data-id="${t.id}" aria-label="Un-settle thread">${svg("undo")}</button>`;
        } else {
          icon = statusIcon(t);
          lbl = `<span class="lbl s-${t.status}">${STATUS[t.status].label}${t.status === "working" ? " " + t.age : ""}</span>`;
          hov = `<button class="ibtn" data-act="snoozemenu" data-id="${t.id}" aria-label="Snooze thread">${svg("clock")}</button><button class="ibtn" data-act="settle" data-id="${t.id}" aria-label="Settle thread">${svg("check")}</button>`;
        }
        return `<div class="irow ${on ? "on" : ""} ${kind === "snoozed" || kind === "settled" ? "parked" : ""}" data-tab="${t.id}">${icon}<span class="txt"><b>${esc(t.title)}</b><small>${esc(w.name)}</small></span>${lbl}<span class="hov">${hov}</span></div>`;
      }
      function sideA() {
        const live = TABS.filter(isLive);
        const needs = live
          .filter((t) => ["approval", "input", "failed", "done"].includes(t.status))
          .sort((a, b) => STATUS[b.status].rank - STATUS[a.status].rank);
        const working = live.filter((t) => t.status === "working");
        const snoozed = TABS.filter((t) => t.snoozed);
        const settled = TABS.filter((t) => t.settled);
        let h =
          secHead("aNeeds", "Needs you", needs.length) +
          (isOpen("aNeeds")
            ? needs.map((t) => irow(t)).join("") ||
              '<div class="sec static"><span class="n">Nothing waiting</span></div>'
            : "");
        h +=
          secHead("aWorking", "Working", working.length) +
          (isOpen("aWorking") ? working.map((t) => irow(t)).join("") : "");
        h += '<div class="divider"></div>';
        h +=
          WS.filter((w) => w.pinned)
            .map(wsRow)
            .join("") + wsBlock(WS.filter((w) => !w.pinned));
        h += '<div class="grow"></div>';
        h +=
          secHead("aSnoozed", "Snoozed", snoozed.length, false) +
          (isOpen("aSnoozed", false) ? snoozed.map((t) => irow(t, "snoozed")).join("") : "");
        h +=
          secHead("aSettled", "Settled", settled.length, false) +
          (isOpen("aSettled", false) ? settled.map((t) => irow(t, "settled")).join("") : "");
        return h;
      }
      function sideB() {
        const bucket = (w) => {
          const tp = topTab(liveOf(w.id));
          if (!tp) return "idle";
          if (tp.status === "working") return "working";
          return "needs";
        };
        const rest = WS.filter((w) => !w.pinned);
        const parts = [
          ["bPinned", "Pinned", WS.filter((w) => w.pinned), true],
          ["bNeeds", "Needs you", rest.filter((w) => bucket(w) === "needs")],
          ["bWorking", "Working", rest.filter((w) => bucket(w) === "working")],
          ["bIdle", "Idle", rest.filter((w) => bucket(w) === "idle")],
        ];
        return parts
          .filter(([, , list]) => list.length)
          .map(
            ([key, label, list, flat]) =>
              secHead(key, label, list.length) +
              (isOpen(key) ? (flat ? list.map(wsRow).join("") : wsBlock(list)) : ""),
          )
          .join("");
      }
      function sideC() {
        return (
          WS.filter((w) => w.pinned)
            .map(wsRow)
            .join("") + wsBlock(WS.filter((w) => !w.pinned))
        );
      }

      /* C, round 2: global rows and popovers. */
      const NEEDS = ["approval", "input", "failed", "done"];
      const bySettled = (a, b) => (a.settledMin ?? 0) - (b.settledMin ?? 0);
      function globalsHtml() {
        const needs = TABS.filter((t) => isLive(t) && NEEDS.includes(t.status)).length;
        const snoozed = TABS.filter((t) => t.snoozed).length;
        const settled = TABS.filter((t) => t.settled).length;
        const row = (kind, icon, label, n, hot) =>
          `<div class="grow-row ${hot ? "hot" : ""} ${S.pop?.kind === kind ? "open" : ""}" data-pop="${kind}">${icon}<span>${label}</span><span class="n">${n}</span></div>`;
        return (
          row("needs", svg("approval", needs ? "s-approval" : ""), "Needs you", needs, needs > 0) +
          row("snoozed", svg("woke"), "Snoozed", snoozed) +
          row("settled", svg("check"), "Settled", settled)
        );
      }
      function popRow(t, { right = "", buttons = "", lead } = {}) {
        const w = wsOf(t.ws);
        return `<div class="prow2" data-open="${t.id}">${lead ?? statusIcon(t)}<span class="txt"><b>${esc(t.title)}</b><small>${projIcon(w)}${esc(w.name)}</small></span>${right ? `<span class="r">${right}</span>` : ""}${buttons}</div>`;
      }
      const snoozedRow = (t) =>
        popRow(t, {
          lead: svg("woke", "s-working"),
          right: esc(t.snoozed),
          buttons: `<button class="btn" data-act="wake" data-id="${t.id}">Wake</button>`,
        });
      const settledRow = (t) =>
        popRow(t, {
          lead: svg("check", "s-idle"),
          right: esc(t.age),
          buttons: `<button class="btn" data-act="unsettle" data-id="${t.id}">Un-settle</button>`,
        });
      function settledBlock(list) {
        const sorted = [...list].sort(bySettled);
        const shown = S.pop.all ? sorted : sorted.slice(0, 10);
        return (
          shown.map(settledRow).join("") +
          (sorted.length > shown.length
            ? `<button class="pmore" data-showall>Show all settled (${sorted.length})</button>`
            : "")
        );
      }
      function popHtml() {
        const k = S.pop.kind;
        if (k === "needs") {
          const live = TABS.filter(isLive);
          const waiting = live.filter((t) => isNeeds(t.status));
          const failed = live.filter((t) => t.status === "failed");
          const done = live.filter((t) => t.status === "done");
          if (!waiting.length && !failed.length && !done.length)
            return '<div class="pempty">Nothing needs you right now.</div>';
          const wRow = (t) =>
            t.status === "approval"
              ? popRow(t, {
                  buttons: `<button class="btn" data-act="decline" data-id="${t.id}">Decline</button><button class="btn primary" data-act="approve" data-id="${t.id}">Approve</button>`,
                })
              : popRow(t, { buttons: `<button class="btn" data-open="${t.id}">Answer</button>` });
          return (
            (waiting.length
              ? '<div class="mhdr">Waiting for you</div>' + waiting.map(wRow).join("")
              : "") +
            (failed.length
              ? '<div class="mhdr">Failed</div>' +
                failed
                  .map((t) => popRow(t, { right: '<span class="s-failed">Failed</span>' }))
                  .join("")
              : "") +
            (done.length
              ? '<div class="mhdr">Finished, not read</div>' +
                done.map((t) => popRow(t, { right: '<span class="s-done">Done</span>' })).join("")
              : "")
          );
        }
        if (k === "snoozed") {
          const list = TABS.filter((t) => t.snoozed);
          return list.length
            ? '<div class="mhdr">Snoozed</div>' + list.map(snoozedRow).join("")
            : '<div class="pempty">No snoozed threads.</div>';
        }
        if (k === "settled") {
          const list = TABS.filter((t) => t.settled);
          return list.length
            ? '<div class="mhdr">Settled, most recent first</div>' + settledBlock(list)
            : '<div class="pempty">No settled threads.</div>';
        }
        const here = tabsOf(S.ws);
        const sn = here.filter((t) => t.snoozed);
        const se = here.filter((t) => t.settled);
        if (!sn.length && !se.length)
          return '<div class="pempty">No snoozed or settled threads here.</div>';
        return (
          (sn.length ? '<div class="mhdr">Snoozed</div>' + sn.map(snoozedRow).join("") : "") +
          (se.length ? '<div class="mhdr">Settled</div>' + settledBlock(se) : "")
        );
      }
      const popEl = document.createElement("div");
      popEl.className = "pop";
      popEl.hidden = true;
      document.body.appendChild(popEl);
      function renderPop() {
        if (!S.pop || body.dataset.base !== "c") {
          popEl.hidden = true;
          return;
        }
        const anchor =
          S.pop.kind === "overflow"
            ? document.querySelector(".over")
            : document.querySelector(`[data-pop="${S.pop.kind}"]`);
        if (!anchor) {
          S.pop = null;
          popEl.hidden = true;
          return;
        }
        const scroll = popEl.scrollTop;
        popEl.innerHTML = popHtml();
        popEl.hidden = false;
        popEl.scrollTop = scroll;
        const a = anchor.getBoundingClientRect();
        const r = popEl.getBoundingClientRect();
        if (S.pop.kind === "overflow") {
          popEl.style.left = `${Math.max(8, Math.min(a.right - r.width, innerWidth - r.width - 8))}px`;
          popEl.style.top = `${a.bottom + 4}px`;
        } else {
          popEl.style.left = `${document.querySelector(".side").getBoundingClientRect().right + 6}px`;
          popEl.style.top = `${Math.max(8, Math.min(a.bottom - r.height, innerHeight - r.height - 8))}px`;
        }
      }
      const togglePop = (kind) => {
        S.pop = S.pop?.kind === kind ? null : { kind, all: false };
        render();
      };

      /* Main area. */
      function tabEl(t, on) {
        const parked = !isLive(t);
        const lead = parked
          ? svg(t.snoozed ? "woke" : "check", t.snoozed ? "s-working" : "s-idle")
          : STATUS[t.status].icon || t.woke
            ? statusIcon(t)
            : prov(t);
        const acts = t.snoozed
          ? `<button data-act="wake" data-id="${t.id}" aria-label="Wake thread">${svg("clock")}</button>`
          : t.settled
            ? `<button data-act="unsettle" data-id="${t.id}" aria-label="Un-settle thread">${svg("undo")}</button>`
            : `<button data-act="snoozemenu" data-id="${t.id}" aria-label="Snooze thread">${svg("clock")}</button><button data-act="settle" data-id="${t.id}" aria-label="Settle thread">${svg("check")}</button>`;
        const attn = isNeeds(t.status) || t.status === "failed" || t.status === "done";
        return `<div class="tab ${on ? "on" : ""} ${parked ? "parked" : ""} ${attn ? "attn" : ""}" data-tab="${t.id}" title="${esc(t.title)}">${lead}<span class="tt">${esc(t.title)}</span>${t.pinned ? svg("pin", "pinmark") : ""}<span class="tact">${acts}</span></div>`;
      }
      function stripView(v) {
        const at = activeTab();
        const live = ordered(liveOf(S.ws));
        const parked = tabsOf(S.ws).filter((t) => !isLive(t));
        const peek = at && !isLive(at) ? at : null;
        const over =
          v !== "a" && parked.length
            ? `<button class="over" data-act="overflow" aria-label="Snoozed and settled threads">+${parked.length}${svg("down")}</button>`
            : "";
        return `<div class="strip"><div class="tabs">${live.map((t) => tabEl(t, t === at)).join("")}${peek ? tabEl(peek, true) : ""}</div>${over}<button class="ibtn" data-act="newthread" aria-label="New thread in ${esc(wsOf(S.ws).name)}">${svg("pen")}</button></div>`;
      }
      function timeline(t) {
        if (!t)
          return '<div class="col"><div class="banner">No threads in this project. Start one with the pen at the end of the strip.</div></div>';
        let h = "";
        if (t.snoozed)
          h += `<div class="banner">${svg("woke", "s-working")}Snoozed until ${esc(t.snoozed)}. It comes back early if it needs you.<button class="btn" data-act="wake" data-id="${t.id}">Wake now</button></div>`;
        if (t.settled)
          h += `<div class="banner">${svg("check")}Settled ${t.age} ago.<button class="btn" data-act="unsettle" data-id="${t.id}">Un-settle</button></div>`;
        h += `<div class="umsg">${esc(t.ask)}</div>`;
        h += `<div class="amsg"><p>I read the relevant files and traced the flow on <code>${esc(t.branch || "scratch")}</code>. Here is where it stands.</p></div>`;
        if (t.status === "approval")
          h += `<div class="card warn"><h4 class="s-approval">${svg("approval")}Pending approval</h4><pre>${esc(t.cmd || "vp run typecheck")}</pre><div class="acts"><button class="btn" data-act="decline" data-id="${t.id}">Cancel</button><button class="btn" data-act="decline" data-id="${t.id}">Decline</button><button class="btn" data-act="approve" data-id="${t.id}">Always allow this session</button><button class="btn primary" data-act="approve" data-id="${t.id}">Approve</button></div></div>`;
        else if (t.status === "input")
          h += `<div class="card"><h4 class="s-input">${svg("input")}${esc(t.q || "Which option should I take?")}</h4><div class="opts">${(t.opts || ["Option one", "Option two"]).map((o) => `<button data-act="approve" data-id="${t.id}">${esc(o)}</button>`).join("")}</div></div>`;
        else if (t.status === "failed")
          h += `<div class="card err"><h4 class="s-failed">${svg("failed")}Error occurred</h4><pre>${esc(t.err || "Process exited with code 1")}</pre></div>`;
        else if (t.status === "working")
          h += `<div class="work">${svg("working", "s-working pulse")}Working for ${t.age} 12s</div>`;
        else if (t.status === "done")
          h += `<div class="amsg"><p>Done. The change is on <code>${esc(t.branch || "scratch")}</code>, tests pass. Review the diff in the right panel.</p></div>`;
        return `<div class="col">${h}</div>`;
      }
      function placeholder(t) {
        if (!t) return "Ask anything. @ files, $ skills, / commands";
        if (t.status === "approval") return "Send a message to decline and redirect the agent";
        if (t.status === "input")
          return "Type your own answer, or leave this blank to use the selected option";
        return "Ask anything. @ files, $ skills, / commands";
      }
      function mainView(v) {
        const t = activeTab();
        const w = wsOf(S.ws);
        const right = `<button class="hbtn">Open</button><button class="ibtn" aria-label="Toggle terminal">${svg("terminal")}</button><button class="ibtn" aria-label="Toggle right panel">${svg("panel")}</button>`;
        const head =
          v === "x"
            ? `<div class="mhead"><div class="crumb"><span class="proj">${esc(w.name)}</span><span class="sep">/</span><span class="title">${esc(t ? t.title : "")}</span></div>${right}</div>`
            : `<div class="mhead"><div class="crumb">${t && t.branch ? `<span class="chip mono">${svg("branch")}${esc(t.branch)}</span>` : '<span class="chip">No Git</span>'}${t ? `<span class="chip">${prov(t)}${esc(t.model)}</span>` : ""}</div>${right}</div>`;
        const composer = `<div class="cwrap"><div class="composer"><div class="ph">${placeholder(t)}</div><div class="bar"><span class="chip">${t ? prov(t) + esc(t.model) : ""}</span><span class="chip">Full access</span><button class="send" aria-label="Send">${svg("up")}</button></div></div></div>`;
        return (
          (v === "x" ? "" : stripView(v)) +
          head +
          `<div class="timeline">${timeline(t)}</div>` +
          composer
        );
      }

      function sbar(v) {
        return v === "x"
          ? `<span class="search">${svg("search")}Search</span><button class="ibtn" aria-label="Filter threads by project">${svg("filter")}</button><button class="ibtn" aria-label="New thread" data-act="newthread">${svg("pen")}</button>`
          : `<span class="goto" data-act="palette">${svg("search")}Go to project…<kbd>⌘K</kbd></span><button class="ibtn" aria-label="Add project" data-act="addproject">${svg("folderPlus")}</button>`;
      }

      function render() {
        const v = body.dataset.base || "x";
        const list = document.querySelector("[data-list]");
        const scroll = list.scrollTop;
        document.querySelector("[data-sbar]").innerHTML = sbar(v);
        list.innerHTML = v === "x" ? sideX() : v === "a" ? sideA() : v === "b" ? sideB() : sideC();
        list.scrollTop = scroll;
        const main = document.querySelector("[data-main]");
        main.className = `main ${v === "x" ? "" : "v-new"}`;
        main.innerHTML = mainView(v);
        main.querySelector(".tab.on")?.scrollIntoView({ block: "nearest", inline: "nearest" });
        const globals = document.querySelector("[data-globals]");
        globals.hidden = v !== "c";
        globals.innerHTML = v === "c" ? globalsHtml() : "";
        if (v === "c" && S.pop?.kind === "overflow")
          main.querySelector(".over")?.classList.add("open");
        renderPop();
        renderDev();
      }

      /* Dev panel. */
      function renderDev() {
        const sel = document.querySelector("[data-target]");
        const target = tabOf(S.target) || activeTab();
        sel.innerHTML = WS.map(
          (w) =>
            `<optgroup label="${esc(w.name)}">${tabsOf(w.id)
              .map(
                (t) =>
                  `<option value="${t.id}" ${t === target ? "selected" : ""}>${esc(t.title)}${t.snoozed ? " (snoozed)" : t.settled ? " (settled)" : ""}</option>`,
              )
              .join("")}</optgroup>`,
        ).join("");
        document.querySelector("[data-sbtns]").innerHTML = CYCLE.map(
          (s) =>
            `<button data-set="${s}" class="${target && target.status === s ? "on" : ""}">${s === "idle" ? "Idle" : STATUS[s].label}</button>`,
        ).join("");
      }
      function setStatus(t, s) {
        t.status = s;
        if ((isNeeds(s) || s === "failed") && t.snoozed) {
          t.snoozed = null;
          t.woke = true;
          toast(`Woke: ${t.title}`);
        }
        render();
      }
      document.querySelector("[data-target]").addEventListener("change", (e) => {
        S.target = e.target.value;
        renderDev();
      });
      document.querySelector("[data-sbtns]").addEventListener("click", (e) => {
        const b = e.target.closest("[data-set]");
        const t = tabOf(S.target) || activeTab();
        if (b && t) setStatus(t, b.dataset.set);
      });

      /* Actions. */
      let toastTimer;
      function toast(msg) {
        document.querySelector(".toast")?.remove();
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        document.querySelector("[data-main]").appendChild(el);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.remove(), 2400);
      }
      function openTab(id) {
        const t = tabOf(id);
        if (!t) return;
        S.ws = t.ws;
        S.tab[t.ws] = id;
        S.target = null;
        if (t.status === "done") t.status = "idle";
        t.woke = false;
        render();
      }
      function act(a, id, arg) {
        const t = tabOf(id);
        switch (a) {
          case "pin":
            t.pinned = true;
            break;
          case "unpin":
            t.pinned = false;
            break;
          case "settle":
            t.settled = true;
            t.settledMin = 0;
            t.age = "now";
            t.pinned = false;
            t.snoozed = null;
            toast(`Settled ${t.title}`);
            break;
          case "unsettle":
            t.settled = false;
            break;
          case "snooze":
            t.snoozed = arg;
            t.woke = false;
            toast(`Snoozed until ${arg}`);
            break;
          case "wake":
            t.snoozed = null;
            break;
          case "unread":
            if (t.status === "idle") t.status = "done";
            break;
          case "archive":
            TABS = TABS.filter((x) => x !== t);
            toast(`Archived ${t.title}`);
            break;
          case "approve":
            t.status = "working";
            break;
          case "decline":
            t.status = "idle";
            break;
          case "open":
            openTab(id);
            return;
          case "wspin":
            wsOf(id).pinned = !wsOf(id).pinned;
            break;
          case "wsgroup":
            wsOf(id).group = arg || undefined;
            break;
          default:
            toast(`${arg || a}: not simulated in the mock`);
            return;
        }
        render();
      }

      /* Menus. */
      const menuEl = document.createElement("div");
      menuEl.className = "menu";
      menuEl.hidden = true;
      document.body.appendChild(menuEl);
      const closeMenu = () => {
        menuEl.hidden = true;
        document.querySelector(".over.open")?.classList.remove("open");
      };
      function itemsHtml(items) {
        return items
          .map((it) => {
            if (it.hdr) return `<div class="mhdr">${esc(it.hdr)}</div>`;
            const sep = it.sep ? '<div class="msep"></div>' : "";
            const kids = it.kids ? `<div class="menu sub">${itemsHtml(it.kids)}</div>` : "";
            const r = it.kids
              ? `<span class="r">${svg("right")}</span>`
              : it.r
                ? `<span class="r">${esc(it.r)}</span>`
                : it.chk
                  ? `<span class="r">${svg("check")}</span>`
                  : "";
            return `${sep}<div class="mi ${it.dis ? "dis" : ""} ${it.danger ? "danger" : ""}" ${it.a && !it.kids ? `data-mact="${it.a}" data-id="${it.id || ""}" data-arg="${esc(it.arg || "")}"` : !it.kids ? `data-mact="none" data-arg="${esc(it.l)}"` : ""}>${it.icon ? it.icon : ""}<span class="ttl">${esc(it.l)}</span>${r}${kids}</div>`;
          })
          .join("");
      }
      function showMenu(items, x, y, alignEnd = false) {
        menuEl.innerHTML = itemsHtml(items);
        menuEl.hidden = false;
        menuEl.classList.remove("flip");
        const r = menuEl.getBoundingClientRect();
        const left = Math.min(alignEnd ? x - r.width : x, innerWidth - r.width - 8);
        const topY = Math.min(y, innerHeight - r.height - 8);
        menuEl.style.left = `${Math.max(8, left)}px`;
        menuEl.style.top = `${Math.max(8, topY)}px`;
        if (left + r.width + 220 > innerWidth) menuEl.classList.add("flip");
      }
      const snoozeItems = (t) => [
        ...SNOOZE.map((p) => ({ l: `${p.l} (${p.w})`, a: "snooze", id: t.id, arg: p.as || p.w })),
        { l: "Custom…", sep: true },
      ];
      function tabMenu(t, v) {
        const running = t.status === "working";
        return [
          { l: "Find in thread" },
          ...(t.branch ? [{ l: `New thread on ${t.branch}` }] : []),
          t.pinned
            ? { l: "Unpin thread", a: "unpin", id: t.id }
            : { l: "Pin thread", a: "pin", id: t.id },
          t.settled
            ? { l: "Un-settle thread", a: "unsettle", id: t.id }
            : { l: "Settle thread", a: "settle", id: t.id },
          t.snoozed
            ? { l: "Wake thread", a: "wake", id: t.id }
            : { l: "Snooze", kids: snoozeItems(t) },
          { l: "Rename thread", sep: true },
          { l: "Regenerate title" },
          { l: "Mark unread", a: "unread", id: t.id },
          { l: "Share with guest" },
          ...(v === "x" ? [{ l: `Filter by ${wsOf(t.ws).name}` }] : []),
          ...(wsOf(t.ws).scratch ? [{ l: "Turn into project", dis: running }] : []),
          { l: "Auto-settle behavior", kids: [{ l: "Enabled", chk: true }, { l: "Disabled" }] },
          {
            l: "Copy",
            sep: true,
            kids: [
              { l: "Path" },
              ...(t.branch ? [{ l: "Branch" }] : []),
              { l: "Thread" },
              { l: "Thread ID" },
            ],
          },
          { l: "Project settings" },
          { l: "Archive thread", sep: true, a: "archive", id: t.id, dis: running },
          { l: "Delete", danger: true },
        ];
      }
      function wsMenu(w) {
        return [
          { l: `New thread in ${w.name}` },
          w.pinned
            ? { l: "Unpin project", a: "wspin", id: w.id }
            : { l: "Pin project", a: "wspin", id: w.id },
          {
            l: "Move to group",
            kids: [
              ...GROUPS.map((g) => ({
                l: g.name,
                a: "wsgroup",
                id: w.id,
                arg: g.id,
                chk: w.group === g.id,
              })),
              { l: "No group", a: "wsgroup", id: w.id, arg: "", chk: !w.group, sep: true },
              { l: "New group…" },
            ],
          },
          { l: "Rename project", sep: true },
          { l: "Project settings" },
          { l: "Remove project", sep: true, danger: true },
        ];
      }
      function overflowMenu() {
        const parked = tabsOf(S.ws).filter((t) => !isLive(t));
        const sn = parked.filter((t) => t.snoozed);
        const se = parked.filter((t) => t.settled);
        return [
          ...(sn.length
            ? [
                { hdr: "Snoozed" },
                ...sn.map((t) => ({
                  l: t.title,
                  r: t.snoozed,
                  a: "open",
                  id: t.id,
                  icon: svg("woke", "s-working"),
                })),
              ]
            : []),
          ...(se.length
            ? [
                { hdr: "Settled" },
                ...se.map((t) => ({
                  l: t.title,
                  r: t.age,
                  a: "open",
                  id: t.id,
                  icon: svg("check"),
                })),
              ]
            : []),
        ];
      }

      document.addEventListener("click", (e) => {
        if (e.target.closest(".pop")) {
          const pb = e.target.closest("[data-act]");
          if (pb) return act(pb.dataset.act, pb.dataset.id);
          if (e.target.closest("[data-showall]")) {
            S.pop.all = true;
            return render();
          }
          const o = e.target.closest("[data-open]");
          if (o) {
            S.pop = null;
            return openTab(o.dataset.open);
          }
          return;
        }
        const pt = e.target.closest("[data-pop]");
        if (pt) {
          closeMenu();
          return togglePop(pt.dataset.pop);
        }
        const isCOverflow = body.dataset.base === "c" && e.target.closest('[data-act="overflow"]');
        if (S.pop && !isCOverflow) {
          S.pop = null;
          render();
        }
        const m = e.target.closest("[data-mact]");
        if (m) {
          closeMenu();
          const a = m.dataset.mact;
          if (a === "none") toast(`${m.dataset.arg}: not simulated in the mock`);
          else act(a, m.dataset.id, m.dataset.arg);
          return;
        }
        if (e.target.closest(".menu")) return;
        const wasOpen = !menuEl.hidden;
        closeMenu();
        const b = e.target.closest("[data-act]");
        if (b) {
          e.stopPropagation();
          const a = b.dataset.act;
          const t = tabOf(b.dataset.id);
          const r = b.getBoundingClientRect();
          if (a === "snoozemenu") return showMenu(snoozeItems(t), r.left, r.bottom + 4);
          if (a === "overflow" && body.dataset.base === "c") return togglePop("overflow");
          if (a === "overflow") {
            if (!wasOpen) {
              showMenu(overflowMenu(), r.right, r.bottom + 4, true);
              b.classList.add("open");
            }
            return;
          }
          if (a === "newthread")
            return toast(`New thread in ${wsOf(S.ws).name}: not simulated in the mock`);
          if (a === "palette")
            return toast("Go to project (⌘K palette): not simulated in the mock");
          if (a === "addproject") return toast("Add project: not simulated in the mock");
          return act(a, b.dataset.id);
        }
        const tg = e.target.closest("[data-toggle]");
        if (tg) {
          const k = tg.dataset.toggle;
          S.open[k] = !isOpen(k, !k.startsWith("x") && !["aSnoozed", "aSettled"].includes(k));
          return render();
        }
        const tb = e.target.closest("[data-tab]");
        if (tb) return openTab(tb.dataset.tab);
        const ws = e.target.closest("[data-ws]");
        if (ws) {
          S.ws = ws.dataset.ws;
          S.target = null;
          const t = activeTab();
          if (t && t.status === "done") t.status = "idle";
          return render();
        }
      });
      document.addEventListener("contextmenu", (e) => {
        const tb = e.target.closest("[data-tab]");
        const ws = e.target.closest("[data-ws]");
        if (!tb && !ws) return;
        e.preventDefault();
        if (tb) showMenu(tabMenu(tabOf(tb.dataset.tab), body.dataset.base), e.clientX, e.clientY);
        else showMenu(wsMenu(wsOf(ws.dataset.ws)), e.clientX, e.clientY);
      });
      addEventListener("resize", () => {
        closeMenu();
        renderPop();
      });

      /* Template mechanics: variant bar, hash, theme, keys. */
      const KEY = `concept:${location.pathname}`;
      const root = document.documentElement;
      const body = document.body;
      const base = (v) => v.replace(/\d+$/, "");
      const load = () => {
        try {
          return JSON.parse(localStorage.getItem(KEY) || "{}");
        } catch {
          return {};
        }
      };
      const save = (state) => {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch {}
      };
      const name = (v) => DESC[v].split(":")[0];
      const label = (v) =>
        /\d$/.test(v)
          ? `${v.slice(-1)} ${base(v).toUpperCase()} ${name(v)}`
          : `${v.toUpperCase()} ${name(v)}`;
      document.querySelector("[data-buttons]").innerHTML = Object.keys(DESC)
        .map((v) => `<button data-v="${v}">${label(v)}</button>`)
        .join(" ");
      const pick = (v) => {
        if (!DESC[v]) return;
        body.dataset.v = v;
        body.dataset.base = base(v);
        document
          .querySelectorAll(".switch [data-v]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
        document.querySelector("[data-desc]").textContent = DESC[v];
        history.replaceState(null, "", `${location.search}#${v}`);
        closeMenu();
        S.pop = null;
        render();
      };
      const setTheme = (t) => {
        root.dataset.theme = t;
        save({ ...load(), theme: t });
      };
      document.querySelector(".switch").addEventListener("click", (e) => {
        const b = e.target.closest("[data-v]");
        if (b) pick(b.dataset.v);
      });
      document
        .querySelector("[data-theme-toggle]")
        .addEventListener("click", () =>
          setTheme(root.dataset.theme === "dark" ? "light" : "dark"),
        );
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (S.pop) {
            S.pop = null;
            render();
          }
          return closeMenu();
        }
        if (
          e.metaKey ||
          e.ctrlKey ||
          e.altKey ||
          e.target.closest("input, textarea, select, [contenteditable]")
        )
          return;
        const k = e.key.toLowerCase();
        if (k === "t") setTheme(root.dataset.theme === "dark" ? "light" : "dark");
        else if (k === "p") body.dataset.chrome = body.dataset.chrome === "off" ? "on" : "off";
        else if (k === "s") {
          const t = activeTab();
          if (t) setStatus(t, CYCLE[(CYCLE.indexOf(t.status) + 1) % CYCLE.length]);
        } else if (/^\d$/.test(k)) pick(`${base(body.dataset.v)}${k}`);
        else pick(k);
      });

      root.dataset.theme = load().theme || "dark";
      const first = Object.keys(DESC)[0];
      pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : first);
    </script>
  </body>
</html>
